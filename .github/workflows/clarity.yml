name: CLARITY Act Probability Watch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Web検索＋AI生成だけテスト（X投稿なし）"
        required: false
        default: false
        type: boolean

  schedule:
    
    - cron: "17 * * * *"

jobs:
  clarity-watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore previous probability
        uses: actions/cache@v4
        with:
          path: clarity_state.json
          key: clarity-state-${{ github.run_id }}
          restore-keys: |
            clarity-state-

      - name: Install packages
        run: pip install tweepy openai

      - name: Run CLARITY bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
         CLARITY_DRY_RUN: ${{ inputs.dry_run || false }} 
        run: python clarity.py
