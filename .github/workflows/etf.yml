name: XRP ETF Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: "35 23 * * *"

jobs:
  update-etf-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ETF data updater
        env:
          SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
        run: python etf_data.py

      - name: Commit ETF data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf_data.json
          git diff --cached --quiet || git commit -m "Update XRP ETF data"
          git push
